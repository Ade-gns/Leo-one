name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Backend Go : format, vet, build, tests (unitaires + intégration contre
  # une vraie base Postgres/TimescaleDB de service, cf. backend/internal/testutil/db.go)
  # ───────────────────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: leo_one_test
          POSTGRES_USER: leo
          POSTGRES_PASSWORD: leo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leo -d leo_one_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://leo:leo_dev@localhost:5432/leo_one_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Appliquer les migrations sur la base de test
        run: |
          export PGPASSWORD=leo_dev
          psql -h localhost -U leo -d leo_one_test -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          for f in backend/migrations/*.sql; do
            echo "→ $f"
            psql -h localhost -U leo -d leo_one_test -f "$f"
          done

      - name: gofmt (formatage)
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formatés (gofmt -w) :"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go build
        working-directory: backend
        run: go build ./...

      - name: go test
        working-directory: backend
        run: go test ./... -v

  # ───────────────────────────────────────────────────────────────────────
  # Frontend React/TS : lint, tests (Vitest + Testing Library), type-check
  # + build (tsc --noEmit && vite build)
  # ───────────────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # ───────────────────────────────────────────────────────────────────────
  # Agent C : compilation cible Linux (cf. agent/CMakeLists.txt).
  # La cible Windows (cross-compilation mingw-w64) n'est pas incluse ici :
  # elle nécessite une build OpenSSL cross-compilée à la main (aucun paquet
  # mingw-w64 OpenSSL dans les dépôts Ubuntu, cf. mémoire du projet
  # "agent windows toolchain") — trop lourd/fragile pour un job CI rapide.
  # À revisiter avec un artefact OpenSSL mingw pré-construit et mis en cache.
  # ───────────────────────────────────────────────────────────────────────
  agent-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Installer les dépendances de build
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      - name: Configurer CMake
        working-directory: agent
        run: cmake -S . -B build -DTARGET_OS=linux -DCMAKE_BUILD_TYPE=Release

      - name: Compiler
        working-directory: agent
        run: cmake --build build -j"$(nproc)" --target leo-agent
